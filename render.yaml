# Render Blueprint for the PersonaFlux API.
#
# The frontend is deployed separately on Vercel; this file provisions the API
# container and a small disk for the model artefacts. The database is NOT created
# here: it lives on Neon, and DATABASE_URL is set in the dashboard (see below).
# The repository root contains the project under personalflux/, so every path
# below is written relative to the repository root.
#
#   Dashboard -> New -> Blueprint -> pick this repository.
#
# After the first deploy, set the three `sync: false` values in the dashboard:
#   DATABASE_URL        Neon connection string, in sqlalchemy form and with SSL:
#                       postgresql+psycopg://user:pass@ep-xxx.eu-central-1.aws.neon.tech/neondb?sslmode=require
#                       (pick the same region as this service, and prefer the
#                       direct host over the `-pooler` one; both work)
#   CORS_ORIGINS        the storefront origin, e.g. https://shop.example.com
#   MODEL_ARTIFACT_URL  a .tar.gz of the artefact directory, optional; without it
#                       the API serves database popularity instead of the model
services:
  - type: web
    name: personaflux-api
    runtime: docker
    plan: starter
    region: frankfurt
    rootDir: personalflux/backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/db
    autoDeploy: true
    disk:
      name: artifacts
      mountPath: /artifacts
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      # Set in the dashboard: the database is managed by Neon, not by this blueprint.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MODEL_ARTIFACT_DIR
        value: /artifacts
      - key: WEB_CONCURRENCY
        value: "2"
      # Each worker polls for a promoted model. This is also what decides how
      # often the database is touched while nobody is shopping: Neon suspends an
      # idle compute, and a poll wakes it again. See DEPLOYMENT.md before raising
      # or lowering this on a usage-billed plan.
      - key: MODEL_POLL_SECONDS
        value: "10"
      - key: LOG_LEVEL
        value: INFO
      # Set both of these in the dashboard before going live.
      - key: CORS_ORIGINS
        sync: false
      - key: MODEL_ARTIFACT_URL
        sync: false
